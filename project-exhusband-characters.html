  <link rel="stylesheet" href="css/style.css" />
  <style>
    .cast {
      position: relative;
      z-index: 1;
      max-width: 1180px;
      margin: 0 auto;
      padding: 128px 24px 60px;
    }

    .cast__back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 26px;
      transition: color 0.3s;
    }
    .cast__back:hover { color: #fff; }

    .cast__head {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 46px;
      max-width: 680px;
    }

    .cast__title {
      font-size: clamp(36px, 5.6vw, 62px);
      line-height: 1.06;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .cast__title em {
      font-family: var(--serif-en);
      font-style: italic;
      font-weight: 400;
      letter-spacing: 0;
    }

    .cast__desc {
      font-size: 14.5px;
      line-height: 1.9;
      color: var(--text-dim);
    }

    .cast__grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 22px;
    }

    .cast-card {
      position: relative;
      border-radius: var(--r-card);
      border: 1px solid var(--line);
      background: rgba(10, 14, 24, 0.66);
      overflow: hidden;
      transition: border-color 0.4s, transform 0.5s var(--ease), box-shadow 0.5s;
    }
    .cast-card:hover {
      border-color: var(--line-strong);
      transform: translateY(-4px);
      box-shadow: 0 26px 70px rgba(0, 0, 0, 0.55);
    }

    .cast-card__media {
      display: block;
      aspect-ratio: 16 / 9;
      background: #f5f5f5;
      overflow: hidden;
      cursor: zoom-in;
    }
    .cast-card__media img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      transition: transform 0.8s var(--ease);
    }
    .cast-card:hover .cast-card__media img { transform: scale(1.03); }

    .cast-card__media.is-missing {
      display: flex;
      align-items: center;
      justify-content: center;
      background: repeating-linear-gradient(45deg, #0d1220, #0d1220 12px, #111829 12px, #111829 24px);
      cursor: default;
    }
    .cast-card__media.is-missing::after {
      content: "图片待补充";
      font-size: 12px;
      letter-spacing: 0.22em;
      color: var(--text-faint);
    }

    .cast-card__meta {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 14px;
      padding: 16px 20px 18px;
      border-top: 1px solid var(--line);
    }
    .cast-card__name { font-size: 15px; font-weight: 700; }
    .cast-card__note { font-size: 12px; color: var(--text-faint); letter-spacing: 0.06em; }

    /* 大图查看 */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4vw;
      background: rgba(3, 5, 10, 0.92);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s;
    }
    .lightbox.is-open { opacity: 1; pointer-events: auto; }
    .lightbox img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 14px;
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.7);
    }
    .lightbox__close {
      position: absolute;
      top: 24px;
      right: 28px;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(10, 14, 24, 0.6);
      color: #fff;
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
    }

    @media (max-width: 760px) {
      .cast { padding: 108px 18px 40px; }
      .cast__grid { grid-template-columns: 1fr; gap: 16px; }
    }
  </style>
</head>
<body>

  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="lightbox__close" id="lightboxClose" aria-label="关闭大图">×</button>
    <img id="lightboxImg" src="" alt="人物形象大图">
  </div>

  <script src="js/main.js"></script>
  <script>
    (function () {
      var box = document.getElementById("lightbox");
      var img = document.getElementById("lightboxImg");
      var close = document.getElementById("lightboxClose");

      function open(src, alt) {
        img.src = src;
        img.alt = alt || "人物形象大图";
        box.classList.add("is-open");
        box.setAttribute("aria-hidden", "false");
        document.body.style.overflow = "hidden";
      }
      function shut() {
        box.classList.remove("is-open");
        box.setAttribute("aria-hidden", "true");
        document.body.style.overflow = "";
      }

      document.querySelectorAll(".cast-card__media img").forEach(function (im) {
        im.addEventListener("error", function () {
          im.parentNode.classList.add("is-missing");
          im.remove();
        });
      });

      document.querySelectorAll("[data-lightbox]").forEach(function (link) {
        link.addEventListener("click", function (e) {
          e.preventDefault();
          if (link.classList.contains("is-missing")) return;
          var im = link.querySelector("img");
          open(link.getAttribute("href"), im ? im.alt : "");
        });
      });

      if (close) close.addEventListener("click", shut);
      if (box) box.addEventListener("click", function (e) { if (e.target === box) shut(); });
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape") shut();
      });
    })();
  </script>
