    .posters {
      position: relative;

    }

    .posters__back {

    .posters__head {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 44px;
      max-width: 700px;
    }

    .posters__title {
      font-size: clamp(36px, 5.6vw, 62px);
      line-height: 1.06;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .posters__title em {
      font-family: var(--serif-en);
      font-style: italic;
      font-weight: 400;
      letter-spacing: 0;
    }

    .posters__desc {
      font-size: 14.5px;
      line-height: 1.9;
      color: var(--text-dim);
    }

    .posters__grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    .poster-card {
      position: relative;
      border-radius: var(--r-card);
      border: 1px solid var(--line);
      background: rgba(10, 14, 24, 0.66);
      overflow: hidden;
      transition: border-color 0.4s, transform 0.5s var(--ease), box-shadow 0.5s;
    }
    .poster-card:hover {
      border-color: var(--line-strong);
      transform: translateY(-4px);
      box-shadow: 0 26px 70px rgba(0, 0, 0, 0.55);
    }

    .poster-card__media {
      display: block;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: #0b0f1a;
      cursor: zoom-in;
    }
    .poster-card__media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.8s var(--ease);
    }
    .poster-card:hover .poster-card__media img { transform: scale(1.04); }

    .poster-card__meta {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 14px;
      padding: 15px 20px 17px;
      border-top: 1px solid var(--line);
    }
    .poster-card__name { font-size: 14.5px; font-weight: 700; }
    .poster-card__note { font-size: 11.5px; color: var(--text-faint); letter-spacing: 0.06em; }

    /* 大图查看 */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4vw;
      background: rgba(3, 5, 10, 0.94);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s;
    }
    .lightbox.is-open { opacity: 1; pointer-events: auto; }
    .lightbox img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 14px;
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.7);
    }
    .lightbox__close {
      position: absolute;
      top: 24px;
      right: 28px;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(10, 14, 24, 0.6);
      color: #fff;
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
    }

    @media (max-width: 760px) {
      .posters { padding: 108px 18px 40px; }
      .posters__grid { grid-template-columns: 1fr; gap: 16px; }
    }

  <div class="lightbox" id="lightbox" aria-hidden="true">

  <script src="js/main.js"></script>
  <script>
    (function () {
      var box = document.getElementById("lightbox");
      var img = document.getElementById("lightboxImg");
      var close = document.getElementById("lightboxClose");

      function open(src, alt) {
        img.src = src;
        img.alt = alt || "新年海报大图";
        box.classList.add("is-open");
        box.setAttribute("aria-hidden", "false");
        document.body.style.overflow = "hidden";
      }
      function shut() {
        box.classList.remove("is-open");
        box.setAttribute("aria-hidden", "true");
        document.body.style.overflow = "";
      }

      document.querySelectorAll("[data-lightbox]").forEach(function (link) {
        link.addEventListener("click", function (e) {
          e.preventDefault();
          var im = link.querySelector("img");
          open(link.getAttribute("href"), im ? im.alt : "");
        });
      });

      if (close) close.addEventListener("click", shut);
      if (box) box.addEventListener("click", function (e) { if (e.target === box) shut(); });
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape") shut();
      });
    })();
  </script>
